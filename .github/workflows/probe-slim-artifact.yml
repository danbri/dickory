name: Probe authentic 4.33.1 slim archive access

on:
  pull_request:
    paths:
      - '.github/workflows/probe-slim-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check anonymous signed GitHub artefact redirect via nightly.link
        run: |
          python3 - <<'PY'
          import urllib.request
          from urllib.parse import urlparse
          u='https://nightly.link/cauli/lean4/suites/93513831068/artifacts/10171167184'
          request=urllib.request.Request(u,method='HEAD',headers={'User-Agent':'DickorySlimArtifactProbe/1.0'})
          try:
              with urllib.request.urlopen(request,timeout=30) as r:
                  print('HTTP status:',r.status)
                  print('Host:',urlparse(r.url).hostname)
                  print('Type:',r.headers.get('Content-Type'))
                  print('Content length:',r.headers.get('Content-Length'))
                  assert r.status==200 and 'zip' in (r.headers.get('Content-Type') or '').lower()
          except Exception as e:
              print('Download probe failed (without exposing signed URL):',type(e).__name__,str(e).split('?')[0][:500])
              raise
          PY
