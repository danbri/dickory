name: Probe authentic 4.33.1 slim archive access

on:
  pull_request:
    paths: ['.github/workflows/probe-slim-artifact.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check public artefact proxy endpoints without downloading 681MB
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error
          from urllib.parse import urlparse
          urls=[
            'https://nightly.link/cauli/lean4/actions/runs/34519035716',
            'https://nightly.link/cauli/lean4/suites/93513831068/artifacts/10171167184',
            'https://nightly.link/cauli/lean4/actions/runs/34519035716/build-Web%20Assembly.zip',
            'https://nightly.link/cauli/lean4/actions/runs/34519035716/build-Web%20Assembly'
          ]
          for url in urls:
            print('Testing path:',urlparse(url).path)
            for method in ('HEAD','GET'):
              try:
                req=urllib.request.Request(url,method=method,headers={
                    'User-Agent':'DickorySlimArtifactProbe/1.0',
                    'Range':'bytes=0-8'
                })
                with urllib.request.urlopen(req,timeout=18) as response:
                    print(method,'status',response.status,'host',urlparse(response.url).hostname,
                          'content-type',response.headers.get('Content-Type'),
                          'length',response.headers.get('Content-Length'),
                          'start',response.read(8) if method=='GET' else '')
              except Exception as e:
                print(method,type(e).__name__,str(e).split('?')[0][:170])
          PY
