name: Veil lab

# labs/veil: IKL statements as invariants of a Veil transition system.
# Veil (https://github.com/verse-lab/veil, Apache-2.0) pins Lean v4.35.0,
# so this lab is checked apart from the Lean 4.33.1 labs.
on:
  push:
    branches: [main]
    paths: ['labs/veil/**', '.github/workflows/veil-lab.yml']
  pull_request:
    paths: ['labs/veil/**', '.github/workflows/veil-lab.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install elan
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: labs/veil/.lake/packages
          key: veil-lab-packages-${{ hashFiles('labs/veil/lake-manifest.json', 'labs/veil/lean-toolchain') }}
      - name: Check the lab
        working-directory: labs/veil
        run: ./tools/check.sh
