name: Verify labs and publish Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - name: Install pinned Lean release
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.33.1/lean-4.33.1-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          echo "890afd185370f85666025b883914ab4f4b339136f8c96167b69cfb62aecaf235  $RUNNER_TEMP/lean.tar.zst" | sha256sum --check
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.33.1-linux/bin" >> "$GITHUB_PATH"
      - name: Verify formal inventory and source mappings
        working-directory: labs/rdf11/cleanroom
        run: python3 tools/verify.py
      - name: Exercise rejection checks
        working-directory: labs/rdf11/cleanroom
        run: python3 tools/negative_checks.py
      - name: Exercise executable closure regressions
        working-directory: labs/rdf11/cleanroom
        run: python3 tools/closure_execution.py
      - name: Exercise executable instance regressions
        working-directory: labs/rdf11/cleanroom
        run: python3 tools/instance_execution.py
      - name: Generate review viewer
        working-directory: labs/rdf11/cleanroom
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/review_viewer.py
      - name: Read the Factoidal source pinned by the npm runtime
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: danbri/factoidal-core
          ref: 6f57afba14e04ed648358e4693790edff69a6cd3
          path: labs/linked-assurance/artifacts/factoidal-source
          persist-credentials: false
      - name: Stage site and check links
        run: |
          npm ci --prefix labs/linked-assurance
          npm install --prefix labs/linked-assurance/tools/headless --ignore-scripts --no-audit --no-fund
          node --test labs/linked-assurance/tests/profile.test.mjs
          node --test labs/linked-assurance/tools/headless/tests/mcp.test.mjs
          node labs/linked-assurance/tools/check_runtime.mjs
          python3 labs/linked-assurance/tools/check_lean.py
          python3 labs/linked-assurance/tools/check_profile.py
          LEAN_PATH="$PWD/labs/linked-assurance/artifacts/lean" lean --json labs/linked-assurance/lean/RunnerParity.lean
          python3 labs/linked-assurance/tools/check_pipeline.py --factoidal labs/linked-assurance/artifacts/factoidal-source
          node labs/linked-assurance/tools/check_tutorial.mjs
          node --test labs/linked-assurance/tests/compiler-cache.test.mjs
          node --test labs/linked-assurance/tests/support-bundle.test.mjs
          python3 labs/linked-assurance/tools/hello/fetch.py
          node labs/linked-assurance/tools/build_browser_host.cjs
          node labs/linked-assurance/tools/hello/node.cjs
          node labs/linked-assurance/tools/build_modules.cjs
          node labs/linked-assurance/tools/build_modules.cjs --policy
          python3 tools/build_site.py
      - name: Check viewer interactions in Chromium
        working-directory: tools/viewer-browser
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
          npm test
          LINKED_SITE_ROOT="$GITHUB_WORKSPACE/_site" node linked-assurance.mjs
          LINKED_SITE_ROOT="$GITHUB_WORKSPACE/_site" node linked-isolation.mjs
          LINKED_SITE_ROOT="$GITHUB_WORKSPACE/_site" node --test linked-headless-parity.test.mjs
      - name: Check real browser Lean through Pages isolation shim
        working-directory: tools/viewer-browser
        run: |
          python3 ../../labs/linked-assurance/tools/serve.py --root ../../_site --port 8081 > "$RUNNER_TEMP/linked-server.log" 2>&1 &
          node linked-probe.mjs --hello
          LEAN_BROWSER=webkit node linked-probe.mjs --hello
          node linked-probe.mjs --startup --webkit --tasks --site=http://127.0.0.1:8081
          node linked-probe.mjs --policy
          node linked-probe.mjs --policy --webkit
          node linked-probe.mjs --tutorial
          LINKED_SITE_ROOT="$GITHUB_WORKSPACE/_site" node linked-policy-parity.mjs
          cp ../../labs/linked-assurance/artifacts/profile-policy-parity.json ../../_site/labs/linked-assurance/artifacts/
          cp ../../labs/linked-assurance/artifacts/hello-node-checks.json ../../_site/labs/linked-assurance/artifacts/
          cp ../../labs/linked-assurance/artifacts/hello-browser-checks.json ../../_site/labs/linked-assurance/artifacts/
          cp ../../labs/linked-assurance/artifacts/hello-webkit-checks.json ../../_site/labs/linked-assurance/artifacts/
          cp ../../labs/linked-assurance/artifacts/startup-webkit.json ../../_site/labs/linked-assurance/artifacts/
          cp ../../labs/linked-assurance/artifacts/policy-browser-checks.json ../../_site/labs/linked-assurance/artifacts/
          cp ../../labs/linked-assurance/artifacts/policy-webkit-checks.json ../../_site/labs/linked-assurance/artifacts/
          cp ../../labs/linked-assurance/artifacts/tutorial-browser-checks.json ../../_site/labs/linked-assurance/artifacts/
          cp ../../labs/linked-assurance/artifacts/isolation-browser-checks.json ../../_site/labs/linked-assurance/artifacts/
      - name: Upload verified site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
